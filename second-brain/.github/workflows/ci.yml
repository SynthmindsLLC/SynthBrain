name: CI
on:
  push:
    paths:
      - "second-brain/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "second-brain/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: second-brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

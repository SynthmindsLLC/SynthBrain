name: Mirror to Synthminds/SynthBrain

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repo (owner/name) to mirror into."
        required: true
        default: "Synthminds/SynthBrain"

concurrency:
  group: mirror-to-synthminds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate inputs and secret
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::error::Secret MIRROR_TOKEN is not set on this repository."
            echo "Create a fine-grained PAT scoped to ${TARGET_REPO} with 'Contents: read and write',"
            echo "then add it as repo secret MIRROR_TOKEN."
            exit 1
          fi
          if ! echo "${TARGET_REPO}" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::Invalid target_repo format: ${TARGET_REPO}"
            exit 1
          fi

      - name: Mirror clone + push
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Use the runner's GITHUB_TOKEN to clone the source so private repos work.
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git" repo.git
          cd repo.git
          # Strip the source token from the fetch URL before pushing (defensive — push URL is set below).
          git remote set-url origin "https://github.com/${SOURCE_REPO}.git"
          git remote set-url --push origin "https://x-access-token:${MIRROR_TOKEN}@github.com/${TARGET_REPO}.git"
          echo "Pushing all refs from ${SOURCE_REPO} to ${TARGET_REPO}..."
          git push --mirror
          echo "Mirror complete."
